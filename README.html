<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber AI - Global Assistant</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            display: flex;
            justify-content: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 800px;
            background-color: #1e1e1e;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .header {
            padding: 20px;
            background-color: #2d2d2d;
            border-bottom: 1px solid #333;
            text-align: center;
        }
        .header h1 { margin: 0; color: #00ff88; font-size: 24px; }
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 15px;
            line-height: 1.4;
        }
        .user-msg {
            align-self: flex-end;
            background-color: #007bff;
            color: white;
            border-bottom-right-radius: 2px;
        }
        .ai-msg {
            align-self: flex-start;
            background-color: #333;
            color: #d1d1d1;
            border-bottom-left-radius: 2px;
        }
        .input-area {
            padding: 20px;
            background-color: #2d2d2d;
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 5px;
            border: 1px solid #444;
            background-color: #1e1e1e;
            color: white;
            outline: none;
        }
        button {
            padding: 12px 20px;
            background-color: #00ff88;
            border: none;
            border-radius: 5px;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background-color: #00cc6a; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">
        <h1>Cyber AI 🤖</h1>
        <small>Smart Assistant - Powered by Gemini AI</small>
    </div>
    
    <div class="chat-box" id="chatBox">
        <div class="message ai-msg">Hello! Ask me absolutely anything—GK, coding, history, math, or cybersecurity.</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask any question..." onkeypress="handleEnter(event)">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');

    function handleEnter(e) {
        if (e.key === 'Enter') sendMessage();
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        addMessage(text, 'user-msg');
        userInput.value = '';

        // Add a placeholder loading message
        const loadingDiv = addMessage("Thinking...", 'ai-msg');

        try {
            // Netlify edge function gateway URL
            const response = await fetch('/.netlify/functions/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: text })
            });

            const data = await response.json();
            loadingDiv.innerText = data.answer || "Sorry, I couldn't compute an answer.";
        } catch (error) {
            loadingDiv.innerText = "Error connecting to server. Please check configurations.";
            console.error(error);
        }
    }

    function addMessage(text, className) {
        const div = document.createElement('div');
        div.className = `message ${className}`;
        div.innerText = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
        return div; // Return instance to modify loading text later
    }
</script>

</body>
</html>
