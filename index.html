<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber AI - Assistant</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            display: flex;
            justify-content: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 800px;
            background-color: #1e1e1e;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .header {
            padding: 15px 20px;
            background-color: #2d2d2d;
            border-bottom: 1px solid #333;
            text-align: center;
        }
        .header h1 { margin: 0; color: #00ff88; font-size: 24px; }
        
        .api-bar {
            background-color: #1a1a1a;
            padding: 10px 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            border-bottom: 1px solid #2d2d2d;
            flex-wrap: wrap;
        }
        .api-bar label {
            font-size: 12px;
            color: #00ff88;
            font-weight: bold;
        }
        .api-bar input {
            flex: 1;
            min-width: 150px;
            padding: 8px 10px;
            background-color: #252525;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            font-size: 12px;
            outline: none;
        }
        .api-bar input:focus {
            border-color: #00ff88;
        }
        .lnk-btn {
            padding: 8px 14px;
            background-color: transparent;
            border: 1px solid #00ff88;
            border-radius: 4px;
            color: #00ff88;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .lnk-btn:hover {
            background-color: #00ff88;
            color: black;
        }

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 15px;
            line-height: 1.4;
        }
        .user-msg {
            align-self: flex-end;
            background-color: #007bff;
            color: white;
            border-bottom-right-radius: 2px;
        }
        .ai-msg {
            align-self: flex-start;
            background-color: #333;
            color: #d1d1d1;
            border-bottom-left-radius: 2px;
        }
        .input-area {
            padding: 20px;
            background-color: #2d2d2d;
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 5px;
            border: 1px solid #444;
            background-color: #1e1e1e;
            color: white;
            outline: none;
        }
        .send-btn {
            padding: 12px 20px;
            background-color: #00ff88;
            border: none;
            border-radius: 5px;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }
        .send-btn:hover { background-color: #00cc6a; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">
        <h1>Cyber AI 🤖</h1>
        <small>Universal AI System</small>
    </div>

    <div class="api-bar">
        <label for="apiKey">Gemini Key:</label>
        <input type="password" id="apiKey" placeholder="Paste your AIzaSy... key here" onchange="saveKey()">
        <!-- FIXED DIRECT LINK BUTTON TO GO RIGHT TO THE API KEY SLOT -->
        <a href="https://google.com" target="_blank" class="lnk-btn">Get Free Key 🔗</a>
    </div>
    
    <div class="chat-box" id="chatBox">
        <div class="message ai-msg">Welcome! Click the "Get Free Key" button above to jump directly onto your Google AI Studio dashboard. Create your free key, paste it into the slot, and ask me any question!</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask a question..." onkeypress="handleEnter(event)">
        <button class="send-btn" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const apiKeyInput = document.getElementById('apiKey');

    window.onload = function() {
        const savedKey = localStorage.getItem('user_gemini_key');
        if (savedKey) {
            apiKeyInput.value = savedKey;
        }
    }

    function saveKey() {
        localStorage.setItem('user_gemini_key', apiKeyInput.value.trim());
    }

    function handleEnter(e) {
        if (e.key === 'Enter') sendMessage();
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        const apiKey = apiKeyInput.value.trim();

        if (!text) return;

        if (!apiKey) {
            alert("Please paste your Google Gemini API Key in the top input bar first!");
            return;
        }

        addMessage(text, 'user-msg');
        userInput.value = '';

        const loadingDiv = addMessage("Thinking...", 'ai-msg');

        try {
            const response = await fetch(`https://googleapis.com{apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: text }] }]
                })
            });

            const data = await response.json();
            
            if(data.error) {
                loadingDiv.innerText = `Error: ${data.error.message}`;
                return;
            }

            const aiText = data.candidates[0].content.parts[0].text;
            loadingDiv.innerText = aiText;

        } catch (error) {
            loadingDiv.innerText = "Failed to connect. Please verify that your API key is correct and valid.";
            console.error(error);
        }
    }

    function addMessage(text, className) {
        const div = document.createElement('div');
        div.className = `message ${className}`;
        div.innerText = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
        return div;
    }
</script>

</body>
</html>
