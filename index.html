<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber AI - Expert Assistant</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            display: flex;
            justify-content: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 800px;
            background-color: #1e1e1e;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .header {
            padding: 20px;
            background-color: #2d2d2d;
            border-bottom: 1px solid #333;
            text-align: center;
        }
        .header h1 { margin: 0; color: #00ff88; font-size: 24px; }
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 15px;
            line-height: 1.4;
        }
        .user-msg {
            align-self: flex-end;
            background-color: #007bff;
            color: white;
            border-bottom-right-radius: 2px;
        }
        .ai-msg {
            align-self: flex-start;
            background-color: #333;
            color: #d1d1d1;
            border-bottom-left-radius: 2px;
        }
        .input-area {
            padding: 20px;
            background-color: #2d2d2d;
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 5px;
            border: 1px solid #444;
            background-color: #1e1e1e;
            color: white;
            outline: none;
        }
        button {
            padding: 12px 20px;
            background-color: #00ff88;
            border: none;
            border-radius: 5px;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background-color: #00cc6a; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">
        <h1>Cyber AI 🤖</h1>
        <small>Expert in Hacking & Coding</small>
    </div>
    
    <div class="chat-box" id="chatBox">
        <div class="message ai-msg">Hello! I am Cyber AI. Ask me anything about ethical hacking, coding, or cybersecurity.</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask a question..." onkeypress="handleEnter(event)">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');

    function handleEnter(e) {
        if (e.key === 'Enter') sendMessage();
    }

    function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        // Add User Message
        addMessage(text, 'user-msg');
        userInput.value = '';

        // Simulate AI Thinking
        setTimeout(() => {
            const response = getAIResponse(text.toLowerCase());
            addMessage(response, 'ai-msg');
        }, 600);
    }

    function addMessage(text, className) {
        const div = document.createElement('div');
        div.className = `message ${className}`;
        div.innerText = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function getAIResponse(input) {
        // Simple keyword-based AI logic
        if (.includes(input, 'hacking') || input.includes('hack')) {
            return "Ethical hacking involves legally breaking into systems to find vulnerabilities. Key tools include Nmap for scanning and Burp Suite for web apps.";
        } else if (input.includes('coding') || input.includes('code')) {
            return "Coding is the process of writing instructions for computers. Python is great for beginners, while C++ is used for performance-critical systems.";
        } else if (input.includes('roblox')) {
            return "To hack Roblox, you typically look for memory injection or cookie theft. But remember, ethical hackers get permission first!";
        } else if (input.includes('sql')) {
            return "SQL Injection is a code injection technique used to attack data-driven applications. It involves inserting malicious SQL statements into an entry field.";
        } else if (input.includes('osint')) {
            return "OSINT (Open Source Intelligence) involves collecting publicly available information to conduct intelligence gathering. Tools like Maltego and Shodan are popular.";
        } else if (input.includes('hello') || input.includes('hi')) {
            return "Hi there! Ready to hack some code?";
        } else {
            return "That's an interesting topic. In the context of cybersecurity, we analyze it from a defensive and offensive perspective.";
        }
    }
</script>

</body>
</html>
